<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Count the bounces</title>
<link rel="stylesheet" href="/bounce.css">
<style>
  body { padding: 32px 16px; }
  main { max-width: 1040px; margin: 0 auto; }
  .tests { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>Count the bounces</h1>
  <p>Three versions of the same test. Play one at a time and count how often the ball touches a wall.
     Turns that stop short of the wall don't count.</p>
  <div class="tests" id="tests"></div>
</main>

<script src="/collect.js"></script>
<script src="/bounce-widget.js"></script>
<script>
  const tests = document.getElementById("tests");
  [
    { variant: "plain", title: "Plain", intro: "A solid ball." },
    { variant: "dots", title: "Moving dots", intro: "The ball is made of dots and only visible while it moves." },
    { variant: "flicker", title: "Colour flicker", intro: "Three balls; you are told which colour to follow." },
  ].forEach((test) => BounceCaptcha.mount(tests, test));
</script>
</body>
</html>
